<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture des Archives - Power Retro Lab</title>
    <!-- Chargement de Marked.js pour lire le Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

        :root {
            --bg-color: #0b0c10;
            --grid-color: #ff007f;
            --text-main: #00f0ff;
            --text-secondary: #fce803;
            --scanline-color: rgba(0, 0, 0, 0.3);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); color: var(--text-main);
            font-family: 'VT323', monospace; overflow-x: hidden;
        }

        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, var(--scanline-color) 50%, transparent 50%);
            background-size: 100% 4px; pointer-events: none; z-index: 1000; opacity: 0.6;
        }

        /* Fenêtre Rétro */
        .retro-window {
            background: rgba(11, 12, 16, 0.9);
            border: 4px solid var(--text-main);
            box-shadow: 8px 8px 0px var(--grid-color);
            max-width: 800px;
            margin: 50px auto;
            position: relative;
            z-index: 10;
        }

        .window-header {
            background-color: var(--text-main); color: var(--bg-color);
            padding: 5px 15px; font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem; display: flex; justify-content: space-between;
        }

        .window-content {
            padding: 30px; font-size: 1.5rem; line-height: 1.6; color: #fff;
        }

        /* Style du texte converti depuis le Markdown */
        .window-content h1, .window-content h2, .window-content h3 {
            font-family: 'Press Start 2P', cursive; color: var(--text-secondary);
            margin-top: 40px; font-size: 1.2rem; line-height: 1.5;
        }
        
        .window-content h1 { font-size: 1.8rem; color: var(--text-main); text-shadow: 2px 2px 0px #ff007f; }
        .window-content img { max-width: 100%; border: 2px solid var(--text-main); }
        .window-content a { color: var(--grid-color); text-decoration: none; }
        .window-content a:hover { text-decoration: underline; color: var(--text-secondary); }

        /* Bouton Retour */
        .btn-back {
            display: block; width: 200px; margin: 20px auto; text-align: center;
            padding: 15px; font-family: 'Press Start 2P', cursive; font-size: 1rem;
            color: var(--bg-color); background-color: var(--text-main);
            border: none; box-shadow: 5px 5px 0px var(--grid-color); text-decoration: none;
            position: relative; z-index: 10;
        }
        .btn-back:hover { background-color: var(--text-secondary); box-shadow: 5px 5px 0px var(--text-main); }

        /* Décoration de fond minimale pour la lecture */
        .grid {
            position: fixed; width: 200vw; height: 100vh; bottom: -50vh; left: -50vw;
            background-image: linear-gradient(var(--grid-color) 2px, transparent 2px), linear-gradient(90deg, var(--grid-color) 2px, transparent 2px);
            background-size: 50px 50px; transform: rotateX(75deg); z-index: -2; opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="grid" style="perspective: 600px;"></div>

    <a href="index.html" class="btn-back">RETOUR</a>

    <div class="retro-window">
        <div class="window-header">
            <span>READER.EXE</span>
            <span>[X]</span>
        </div>
        <!-- C'est ici que l'article va s'afficher tout seul -->
        <div class="window-content" id="article-content">
            <p style="color: var(--grid-color);">>>> CHARGEMENT DES DONNÉES...</p>
        </div>
    </div>

    <script>
        // Ce script regarde l'URL pour savoir quel article charger
        const urlParams = new URLSearchParams(window.location.search);
        const articleID = urlParams.get('id');

        const contentDiv = document.getElementById('article-content');

        if (articleID) {
            // Va chercher le fichier texte dans le dossier 'articles'
            fetch(`articles/${articleID}.md`)
                .then(response => {
                    if (!response.ok) throw new Error("Fichier introuvable");
                    return response.text();
                })
                .then(text => {
                    // Convertit le Markdown en HTML Rétro
                    contentDiv.innerHTML = marked.parse(text);
                })
                .catch(error => {
                    contentDiv.innerHTML = `<h1>ERREUR 404</h1><p style="color: red;">Données corrompues ou introuvables sur le secteur ${articleID}.</p>`;
                });
        } else {
            contentDiv.innerHTML = `<h1>ERREUR SYSTEME</h1><p>Aucun identifiant d'article fourni.</p>`;
        }
    </script>
</body>
</html>
